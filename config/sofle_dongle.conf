# Encoders
CONFIG_SENSOR=y
CONFIG_ZMK_KEYMAP_SENSORS=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# USB output to PC
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=y

# Keep BLE for split halves
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# No Bluetooth host profiles for PC/phone/tablet
CONFIG_ZMK_BLE_PROFILE_COUNT=0

# Enough BLE connections only for the two halves
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2